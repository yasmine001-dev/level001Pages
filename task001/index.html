<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Favorite Animals</title>

    <style>
        /* Tag selector */
        body {
            background-color: #f4f8ff;
            color: #222;
            font-size: 18px;
        }

        /* Tag selector */
        h1 {
            color: #2457a6;
            font-size: 36px;
        }

        /* Class selector */
        .animal-name {
            color: #d35400;
            font-weight: bold;
            font-size: 22px;
        }

        /* ID selector */
        #favorite {
            background-color: #fff0d9;
            color: #8a4300;
            font-weight: bold;
            font-size: 24px;
        }

        /* Tag selector */
        label {
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>My Favorite Animals</h1>

    <p>
        Animals are amazing and every animal has something special.<br>
        Here are some of my favorite animals.
    </p>

    <h2 id="favorite">My Favorite Animals</h2>

    <ul>
        <li><span class="animal-name">Cat</span></li>
        <li><span class="animal-name">Dog</span></li>
        <li><span class="animal-name">Lion</span></li>
    </ul>

    <h2>My Ranking</h2>

    <ol>
        <li>Cat</li>
        <li>Dog</li>
        <li>Lion</li>
    </ol>

    <h2>Animal Gallery</h2>

    <p>
        <img
            src="https://images.unsplash.com/photo-1518791841217-8f162f1e1131?auto=format&fit=crop&w=300&q=80"
            alt="Cat"
            width="200"
        >
        <span class="animal-name">Cat</span>
    </p>

    <p>
        <img
            src="https://images.unsplash.com/photo-1552053831-71594a27632d?auto=format&fit=crop&w=300&q=80"
            alt="Dog"
            width="200"
        >
        <span class="animal-name">Dog</span>
    </p>

    <p>
        <img
            src="https://images.unsplash.com/photo-1546182990-dffeafbe841d?auto=format&fit=crop&w=300&q=80"
            alt="Lion"
            width="200"
        >
        <span class="animal-name">Lion</span>
    </p>

    <h2>What About You?</h2>

    <label>Your Favorite Animals :
    <input type="text" name="name">
</label>
    <br><br>

    <label>Your Email:
    <input type="email" name="email">
</label>
    <br><br>

    <input type="button" value="Submit">

</body>
</html>
